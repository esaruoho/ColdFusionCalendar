    <div id="app">
        <header class="main-header">
            <div class="logo-area">
                <span class="label">Historical Archive</span>
                <h1>THE FUSION CALENDAR</h1>
            </div>
            <div class="controls">
                <button id="prevMonth" class="nav-btn">&larr;</button>
                <div class="current-period">
                    <span id="monthDisplay">January</span>
                    <span id="yearDisplay">2013</span>
                </div>
                <button id="nextMonth" class="nav-btn">&rarr;</button>
            </div>
        </header>

        <main class="calendar-container">
            <div class="calendar-wrapper">
                <div class="days-of-week">
                    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                </div>
                <div id="calendarGrid" class="calendar-grid"></div>
            </div>

            <aside class="event-details" id="eventDetails">
                <div class="empty-state">
                    <div class="fusion-ring"></div>
                    <p>Select a highlighted day to unveil the history of cold fusion.</p>
                </div>
            </aside>
        </main>

        <footer class="main-footer">
            <div class="stats">
                <div class="stat-item">
                    <span class="val" id="eventCount">0</span>
                    <span class="lab">Historical Milestones</span>
                </div>
            </div>
            <div class="signature">
                An Interactive Chronology of Low Energy Nuclear Reactions
            </div>
        </footer>
    </div>

    <div class="bg-fx">
        <div class="particle-container" id="particles"></div>
    </div>
