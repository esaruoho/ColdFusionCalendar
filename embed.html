<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today in Cold Fusion History</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05070a; --card-bg: #0d1117;
            --accent-color: #00e5ff; --gold: #d4af37;
            --text-primary: #f0f6fc; --text-secondary: #8b949e;
            --border-color: rgba(255,255,255,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: var(--bg-color); color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            padding: 1rem; overflow-y: auto;
        }
        .embed-header {
            display: flex; justify-content: space-between; align-items: baseline;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color);
        }
        .embed-title {
            font-family: 'Cinzel', serif;
            font-size: 0.7rem; letter-spacing: 0.25em;
            color: var(--gold); text-transform: uppercase;
        }
        .embed-date {
            font-family: 'Cinzel', serif; font-size: 0.85rem; color: var(--accent-color);
        }
        .ev {
            margin-bottom: 0.85rem; padding: 0.5rem 0.65rem;
            border-left: 2px solid var(--accent-color);
            background: rgba(0,229,255,0.03);
        }
        .ev-meta {
            font-family: 'Cinzel', serif; font-size: 0.7rem;
            color: var(--gold); letter-spacing: 0.05em; margin-bottom: 0.2rem;
        }
        .ev-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 0.25rem; }
        .ev-blurb {
            font-family: 'Playfair Display', serif; font-style: italic;
            font-size: 0.85rem; line-height: 1.5;
            color: var(--text-secondary);
        }
        .ev-blurb a { color: var(--accent-color); text-decoration: none; border-bottom: 1px dotted var(--accent-color); }
        .embed-footer {
            margin-top: 1rem; padding-top: 0.5rem;
            border-top: 1px solid var(--border-color);
            text-align: center; font-size: 0.7rem; letter-spacing: 0.1em;
        }
        .embed-footer a { color: var(--text-secondary); text-decoration: none; }
        .embed-footer a:hover { color: var(--accent-color); }
        .empty {
            padding: 1rem; text-align: center;
            color: var(--text-secondary); font-style: italic; font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="embed-header">
        <div class="embed-title">Today in Cold Fusion History</div>
        <div class="embed-date" id="dateLabel"></div>
    </div>
    <div id="events"></div>
    <div class="embed-footer">
        <a href="https://www.lackluster.org/cf/" target="_blank" rel="noopener">The Cold Fusion Calendar →</a>
    </div>
    <script>
        const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        const DATA_URL = 'datasets/40d7f378-7b62-44f6-8196-5bae64a95169/data.json';

        function escapeHtml(s) {
            return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
        function formatBlurb(text) {
            let h = escapeHtml(text);
            return h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
        }

        const params = new URLSearchParams(location.search);
        const dayParam = params.get('day') || 'today';
        let target;
        if (dayParam === 'today') {
            target = new Date();
        } else {
            const m = dayParam.match(/^(\d{1,2})-(\d{1,2})$/) || dayParam.match(/^\d{4}-(\d{1,2})-(\d{1,2})$/);
            if (m) { target = new Date(); target.setMonth(parseInt(m[1],10) - 1); target.setDate(parseInt(m[2],10)); }
            else target = new Date();
        }
        const tm = target.getMonth() + 1, td = target.getDate();
        document.getElementById('dateLabel').textContent = `${MONTHS[target.getMonth()]} ${td}`;

        fetch(DATA_URL).then(r => r.json()).then(events => {
            const matches = events.filter(e => e.month === tm && e.date === td)
                .sort((a, b) => a.year - b.year);
            const container = document.getElementById('events');
            if (matches.length === 0) {
                container.innerHTML = '<div class="empty">No recorded milestones on this day — yet.</div>';
                return;
            }
            container.innerHTML = matches.map(e => {
                const yr = e.year > 0 ? e.year : (e.year < 0 ? Math.abs(e.year) + ' BCE' : 'Unspecified era');
                const link = `https://www.lackluster.org/cf/#${e.year}-${e.month}-${e.date}`;
                return `<a href="${link}" target="_blank" rel="noopener" style="display:block; color:inherit; text-decoration:none;">
                    <div class="ev">
                        <div class="ev-meta">${yr} · ${e.taxonomy || 'Research'} · ${e.country || 'Global'}</div>
                        <div class="ev-name">${escapeHtml(e.name)}</div>
                        <div class="ev-blurb">${formatBlurb(e.blurb)}</div>
                    </div>
                </a>`;
            }).join('');
        });
    </script>
</body>
</html>
